<style>
/* Layout: phone-first learning app — one column, cards, fixed bottom tab bar; copper accent like Kupferrohr */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#d9dfe5;
  --accent:#b8612b; --accent-ink:#ffffff; --accent-soft:#f6e6da;
  --ok:#1f7a4d; --ok-soft:#dcf0e5; --bad:#b4322c; --bad-soft:#f8e0de; --mid:#c99a2e;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171d; --surface:#1a222a; --fg:#e6ebf0; --muted:#97a4b0; --line:#2d3842;
  --accent:#e08a50; --accent-ink:#1a0f07; --accent-soft:#3a2617;
  --ok:#5cc88f; --ok-soft:#173326; --bad:#ee7a72; --bad-soft:#3b1c1a; --mid:#e2b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#1a222a; --fg:#e6ebf0; --muted:#97a4b0; --line:#2d3842;
  --accent:#e08a50; --accent-ink:#1a0f07; --accent-soft:#3a2617;
  --ok:#5cc88f; --ok-soft:#173326; --bad:#ee7a72; --bad-soft:#3b1c1a; --mid:#e2b54a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
body.inquiz main{padding-bottom:40px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:20px}
.ptitle{font-size:30px;margin-top:6px}
.sec{margin:6px 0 -4px}
.sub{color:var(--muted);font-size:15px;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card,.gcard,.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding:4px 0}
.hero h1{margin-top:4px}
.rings{display:flex;align-items:center;gap:14px}
.streak{display:grid;text-align:center}
.streak b{font-family:var(--display);font-size:30px;line-height:1;color:var(--accent)}
.streak span{font-size:12px;color:var(--muted);max-width:70px}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 18px;font-size:18px;width:100%}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.actions .btn:not(.big){flex:1 1 140px}
.sbar{display:flex;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.sbar i{display:block;height:100%}
.sbar .sure,.legend .sure{background:var(--ok)}
.sbar .learned,.legend .learned{background:var(--mid)}
.sbar .wrong,.legend .wrong{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .new{background:var(--line)}
.glist{display:grid;gap:10px}
.gcard{display:grid;gap:2px;text-align:left;cursor:pointer;width:100%}
.gcard:hover{border-color:var(--accent)}
.gname{font-family:var(--display);font-weight:700;font-size:19px}
.meta{font-size:14px;font-weight:600;color:var(--accent);margin-top:4px}
.resume{display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;border-color:var(--accent);background:var(--accent-soft);width:100%}
.resume span{display:grid}
.go{font-size:28px;color:var(--accent)}
.tlist{display:grid;gap:4px;margin-top:12px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:0;background:var(--bg);cursor:pointer}
.trow:hover{outline:1.5px solid var(--accent)}
.trow .sbar{grid-column:1/-1;margin-top:4px;height:6px}
.tname{font-weight:600}
.tcount{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kpis div{display:grid}
.kpis b{font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{font-size:14px;color:var(--muted)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;margin-top:12px}
.srow .sbar{grid-column:1/-1;margin-top:4px}
.hrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.notice{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice p{margin:0;flex:1 1 200px}
.share{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:3}
.icon{border:0;background:transparent;font-size:20px;cursor:pointer;padding:6px 8px;color:var(--muted);display:grid;place-items:center}
.qprog{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcount,.timer{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.star{border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;display:grid;place-items:center;padding:4px}
.star.on{color:var(--mid)}
.situ{font-size:14px;color:var(--muted);margin:8px 0 0}
.qtext{font-size:20px;line-height:1.4;margin:10px 0 16px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font-family:var(--mono);font-size:14px;width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--bg)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:12px;border-left:5px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb p{margin:4px 0 0}
.qnav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.qnav .btn{flex:1}
.hint{text-align:center;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:8px}
.grid button{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:14px;cursor:pointer}
.grid button.filled{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
/* result */
.res .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:6px}
.res .pts{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.res .pts .sub{font-size:20px}
.res .grade{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent)}
.rev .rq{margin:6px 0;font-weight:600}
.rev .ra{margin:0;color:var(--ok);font-weight:600}
.rev .rx{margin:2px 0 6px;color:var(--bad);font-size:15px}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:600px}
#tabs button{border:0;background:transparent;padding:10px 4px 12px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
#tabs button svg{width:24px;height:24px}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs[hidden]{display:none}
.gcard.extra{border-style:dashed;opacity:.85}
.formel{margin:4px 0 14px;padding:10px 14px;border-radius:12px;background:var(--accent-soft)}
.formel p{margin:2px 0 0;font-family:var(--mono);font-size:15px}
.cin{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px;margin-top:6px}
.cin input{border:0;background:transparent;width:100%;min-width:0;padding:14px 0;font:inherit;font-family:var(--mono);font-size:22px;color:var(--fg);text-align:right}
.cin input:focus{outline:none}
.cin:focus-within{border-color:var(--accent)}
.cin span{margin-left:10px;color:var(--muted);font-weight:600}
.cin.right{border-color:var(--ok);background:var(--ok-soft)}
.cin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:2px 0}
/* Nachschlagewerk */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.twrap table{border-collapse:collapse;width:100%;font-size:15px}
.twrap th,.twrap td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.twrap th{background:var(--bg);font-weight:600;font-size:13px;color:var(--muted);vertical-align:bottom}
.twrap tr:last-child td{border-bottom:0}
.twrap td.num{text-align:right;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.twrap th.num{text-align:right}
.swatch{display:inline-block;width:30px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px;border:1px solid var(--line)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fgrid label{display:grid;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
.fgrid select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:56px;width:100%}
.fgrid .cin{margin-top:0}
.cres{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.2;margin:16px 0 0;font-variant-numeric:tabular-nums}
.cres.warn{color:var(--bad)}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;justify-self:start}
.fcard p{margin:4px 0 0}
.fcard .fx{font-family:var(--mono);font-size:18px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const TOP = {
  aus:"Ausbildung und Beruf", js:"Jugend- und Arbeitsschutz", av:"Arbeitsvertrag und Arbeitsrecht",
  tm:"Tarif und Mitbestimmung", sv:"Sozialversicherung und Vorsorge", ls:"Lohn und Steuern",
  vr:"Verträge und Recht", bh:"Betrieb und Handwerk", wg:"Wirtschaft und Geld", um:"Umwelt", re:"Kalkulation und Rechnen"
};
const SITU = "Paul, 17, Azubi zum Anlagenmechaniker SHK bei der Weber Haustechnik GmbH in Darmstadt. 12 Beschäftigte, davon 3 Azubis. Inhaber und Meister: Thomas Weber.";
const TOPIC_OF = {1:"aus",2:"aus",3:"aus",4:"js",5:"js",6:"sv",7:"tm",8:"tm",9:"js",10:"vr",11:"bh",12:"bh",13:"aus",14:"sv",15:"ls",16:"sv",17:"vr",18:"vr",19:"re",20:"um",
  21:"js",22:"js",23:"js",24:"js",25:"tm",26:"tm",27:"tm",28:"av",29:"av",30:"av",31:"sv",32:"sv",33:"re",34:"re",35:"re",36:"vr",37:"vr",38:"bh",39:"tm",40:"aus"};
const M = (n,tp,q,o,a,w) => ({n,p:null,tp,t:"mc",q,o,a,w});
const EXTRA = [
// Ausbildung und Beruf
M(101,"aus","Wo ist festgelegt, welche Inhalte der Betrieb in der Ausbildung zum Anlagenmechaniker SHK vermitteln muss?",["im Tarifvertrag","in der Ausbildungsordnung mit dem Ausbildungsrahmenplan","in der Betriebsvereinbarung","in der Schulordnung der Berufsschule"],1,"Die Ausbildungsordnung mit Ausbildungsrahmenplan gilt für den Betrieb. Für die Berufsschule gilt der Rahmenlehrplan."),
M(102,"aus","Was bedeutet duale Berufsausbildung?",["Man lernt zwei Berufe gleichzeitig.","Man legt zwei Prüfungen bei zwei Kammern ab.","Man lernt an zwei Lernorten: im Betrieb und in der Berufsschule.","Man macht Ausbildung und Studium zugleich."],2,"Dual heißt: zwei Lernorte, Betrieb und Berufsschule."),
M(103,"aus","Wer überwacht die Ausbildung in Handwerksbetrieben?",["die Gewerkschaft","die Agentur für Arbeit","die Handwerkskammer mit ihren Ausbildungsberatern","das Finanzamt"],2,"Die Handwerkskammer ist zuständige Stelle und überwacht die Ausbildung."),
M(104,"aus","Wo muss der Ausbildungsvertrag von Paul eingetragen werden?",["in die Handwerksrolle","in die Lehrlingsrolle (Verzeichnis der Ausbildungsverhältnisse) der Handwerkskammer","ins Handelsregister","ins Grundbuch"],1,"Ausbildungsverträge stehen in der Lehrlingsrolle. In der Handwerksrolle stehen die Betriebe."),
M(105,"aus","Paul besteht die Gesellenprüfung zwei Monate vor dem vertraglichen Ende. Wann endet sein Ausbildungsverhältnis?",["mit Bekanntgabe des Prüfungsergebnisses","am vertraglich vereinbarten Ende","am Ende des Kalenderjahres","erst mit Übergabe des Gesellenbriefs"],0,"§ 21 BBiG: Bei bestandener Prüfung endet die Ausbildung mit der Bekanntgabe des Ergebnisses."),
M(106,"aus","Paul fällt durch die Gesellenprüfung. Was gilt?",["Die Ausbildung endet sofort, eine Wiederholung ist nicht möglich.","Auf sein Verlangen verlängert sich die Ausbildung bis zur nächsten Wiederholungsprüfung, höchstens um ein Jahr.","Der Betrieb entscheidet allein über eine Verlängerung.","Die Ausbildung verlängert sich automatisch um zwei Jahre."],1,"§ 21 Abs. 3 BBiG: Verlängerung auf Verlangen des Azubis, höchstens ein Jahr."),
M(107,"aus","Wie oft darf eine nicht bestandene Gesellenprüfung wiederholt werden?",["gar nicht","einmal","zweimal","beliebig oft"],2,"Die Gesellenprüfung kann zweimal wiederholt werden."),
M(108,"aus","Was muss im Ausbildungsvertrag mindestens stehen?",["die Noten aus der Berufsschule","Beginn und Dauer der Ausbildung, Probezeit, Vergütung und Urlaub","der spätere Gesellenlohn","die Namen der Prüfer"],1,"§ 11 BBiG nennt unter anderem Beginn, Dauer, Probezeit, Vergütung, Urlaub und Arbeitszeit."),
M(109,"aus","Welche Vereinbarung im Ausbildungsvertrag ist nichtig?",["eine Probezeit von drei Monaten","30 Tage Urlaub","Paul muss nach der Ausbildung drei Jahre im Betrieb bleiben.","Die Vergütung wird monatlich gezahlt."],2,"§ 12 BBiG: Eine Bindung über die Ausbildung hinaus ist nichtig. Erlaubt ist nur, in den letzten 6 Monaten eine Weiterbeschäftigung zu vereinbaren."),
M(110,"aus","Wer zahlt die überbetrieblichen Lehrgänge (ÜLU) von Paul?",["Paul selbst","seine Eltern","der Ausbildungsbetrieb","die Berufsschule"],2,"Ausbildungskosten trägt der Betrieb. Der Azubi darf damit nicht belastet werden."),
M(111,"aus","Was gilt für den Ausbildungsnachweis (Berichtsheft)?",["Paul führt ihn in der Freizeit, eine Kontrolle gibt es nicht.","Er ist freiwillig.","Paul darf ihn während der Arbeitszeit führen, der Ausbilder kontrolliert ihn, und er ist Voraussetzung für die Zulassung zur Prüfung.","Ihn führt die Berufsschule."],2,"§ 13 und § 14 BBiG: Führen in der Arbeitszeit, regelmäßige Kontrolle, Zulassungsvoraussetzung."),
M(112,"aus","Was muss der Betrieb Paul am Ende der Ausbildung ausstellen?",["nichts","ein schriftliches Zeugnis, auf Verlangen auch mit Angaben zu Verhalten und Leistung","nur eine mündliche Beurteilung","den Gesellenbrief"],1,"§ 16 BBiG. Den Gesellenbrief bzw. das Prüfungszeugnis stellt die Innung bzw. Kammer aus."),
M(113,"aus","Gilt der gesetzliche Mindestlohn für Auszubildende?",["Ja, ab dem ersten Tag.","Nein, für sie gilt die Mindestausbildungsvergütung nach dem Berufsbildungsgesetz.","Nur ab dem dritten Ausbildungsjahr.","Nur für volljährige Auszubildende."],1,"Azubis sind vom Mindestlohngesetz ausgenommen. § 17 BBiG regelt die Mindestvergütung."),
M(114,"aus","Wie muss sich die Ausbildungsvergütung entwickeln?",["Sie bleibt gleich.","Sie muss mindestens jährlich ansteigen.","Sie darf sinken, wenn der Betrieb Verluste hat.","Sie steigt nur nach der Zwischenprüfung."],1,"§ 17 BBiG: Die Vergütung steigt mit fortschreitender Ausbildung, mindestens jährlich."),
// Jugend- und Arbeitsschutz

M(706,"vr","Welcher Vertrag ist von Anfang an nichtig?",["ein mündlicher Kaufvertrag über ein Fahrrad","ein Vertrag über Schwarzarbeit","ein Vertrag mit einem 19-Jährigen","ein Vertrag per E-Mail"],1,"Verträge, die gegen ein gesetzliches Verbot verstoßen, sind nichtig. Der Handwerker hat dann auch keinen Lohnanspruch."),
M(707,"vr","Wann kann ein Vertrag angefochten werden?",["wenn einem der Preis nicht mehr gefällt","bei Irrtum, arglistiger Täuschung oder Drohung","wenn ein Jahr vergangen ist","nie"],1,"Die Anfechtung macht den Vertrag rückwirkend nichtig."),
M(708,"vr","Was bewirkt die Abnahme beim Werkvertrag?",["Nichts, sie ist nur eine Formalität.","Die Vergütung wird fällig, die Gewährleistungsfrist beginnt und die Beweislast für Mängel geht auf den Kunden über.","Der Kunde darf nicht mehr reklamieren.","Der Handwerker muss den Preis senken."],1,"Deshalb ist ein Abnahmeprotokoll wichtig."),
M(709,"vr","Der Großhändler liefert Heizkörper unter Eigentumsvorbehalt. Was bedeutet das?",["Die Heizkörper gehören sofort dem Betrieb.","Die Heizkörper bleiben Eigentum des Großhändlers, bis sie vollständig bezahlt sind.","Der Betrieb darf sie nicht einbauen.","Der Großhändler haftet für den Einbau."],1,"Er sichert den Verkäufer gegen Zahlungsausfall."),
M(710,"vr","Paul nimmt eine Bohrmaschine des Betriebs mit auf die Baustelle. Was stimmt?",["Paul ist Eigentümer und Besitzer.","Paul ist Besitzer, der Betrieb bleibt Eigentümer.","Der Kunde wird Eigentümer.","Niemand ist Besitzer."],1,"Besitz ist die tatsächliche Herrschaft, Eigentum die rechtliche."),
M(711,"vr","Wann kommt ein Kunde spätestens in Zahlungsverzug, wenn kein Termin vereinbart ist?",["sofort nach Erhalt der Rechnung","30 Tage nach Fälligkeit und Zugang der Rechnung, bei Verbrauchern nur, wenn die Rechnung darauf hinweist","nach einem Jahr","erst nach der dritten Mahnung"],1,"§ 286 Abs. 3 BGB."),
M(712,"vr","Ein Kunde reagiert auf einen gerichtlichen Mahnbescheid nicht. Was kann der Betrieb tun?",["nichts mehr","einen Vollstreckungsbescheid beantragen","die Heizung wieder ausbauen","sofort pfänden ohne Titel"],1,"Mit dem Vollstreckungsbescheid kann der Gerichtsvollzieher vollstrecken."),
M(713,"vr","Ein Kunde bestellt online einen Badheizkörper. Wie lange darf er den Vertrag widerrufen?",["gar nicht","7 Tage","14 Tage","30 Tage"],2,"Widerrufsrecht bei Fernabsatz und Verträgen außerhalb von Geschäftsräumen: 14 Tage."),
M(714,"vr","Der Kostenvoranschlag für ein Bad wird deutlich überschritten. Was muss der Betrieb tun?",["nichts","den Kunden unverzüglich informieren","einfach weiterarbeiten und am Ende abrechnen","die Arbeit sofort einstellen und gehen"],1,"§ 649 BGB: Bei wesentlicher Überschreitung (Faustregel 15 bis 20 %) muss der Kunde informiert werden. Er darf dann kündigen."),
M(715,"vr","Wie lange gilt die gesetzliche Gewährleistung beim Kauf neuer Ware durch einen Verbraucher?",["6 Monate","1 Jahr","2 Jahre","5 Jahre"],2,"2 Jahre. Im ersten Jahr wird vermutet, dass der Mangel schon beim Kauf da war."),
M(716,"vr","Der Großhandel liefert falsche Heizkörper. Was muss der Betrieb als Kaufmann tun?",["Er hat ein Jahr Zeit zu reklamieren.","Er muss die Ware unverzüglich prüfen und den Mangel sofort rügen.","Er muss die Ware behalten.","Er darf erst nach dem Einbau reklamieren."],1,"§ 377 HGB: Untersuchungs- und Rügepflicht beim Handelskauf. Sonst verliert er seine Rechte."),
M(717,"vr","Paul beschädigt beim Kunden fahrlässig Fliesen. Wer haftet gegenüber dem Kunden?",["Paul allein","der Betrieb, weil Paul sein Erfüllungsgehilfe ist","die Berufsschule","niemand"],1,"§ 278 BGB. Der Betrieb haftet für Fehler seiner Mitarbeiter wie für eigene."),
M(718,"vr","Was sind Allgemeine Geschäftsbedingungen (AGB)?",["Gesetze des Bundestags","vorformulierte Vertragsbedingungen für viele Verträge","Regeln der Handwerkskammer","Tarifverträge"],1,"Sie werden nur Vertragsbestandteil, wenn der Kunde darauf hingewiesen wurde. Überraschende Klauseln sind unwirksam."),

M(804,"bh","Welche Aufgabe hat die Handwerkskammer nicht?",["die Handwerksrolle führen","die Berufsausbildung regeln und überwachen","Löhne im Tarifvertrag festlegen","Meisterprüfungen durchführen"],2,"Tarifverträge schließen Gewerkschaften und Arbeitgeberverbände bzw. Innungen."),
M(805,"bh","Was berechtigt in der Regel dazu, einen SHK-Betrieb selbstständig zu führen?",["die Gesellenprüfung","die Meisterprüfung","ein Führerschein","ein Studium der Wirtschaft"],1,"SHK ist zulassungspflichtig (Anlage A HwO). Es gibt Ausnahmen wie die Altgesellenregelung."),

M(807,"bh","Wie haften die Gesellschafter einer OHG?",["nur mit ihrer Einlage","unbeschränkt mit ihrem gesamten Vermögen, jeder für alle Schulden","gar nicht","nur der älteste Gesellschafter"],1,"OHG: unbeschränkt, unmittelbar und solidarisch."),
M(808,"bh","Wie haftet ein Kommanditist in einer KG?",["unbeschränkt","nur bis zur Höhe seiner Einlage","gar nicht","doppelt so viel wie der Komplementär"],1,"Der Komplementär haftet unbeschränkt."),
M(809,"bh","Was darf ein Prokurist ohne besondere Befugnis nicht?",["Material einkaufen","Mitarbeiter einstellen","Grundstücke verkaufen oder belasten","Kredite aufnehmen"],2,"Prokura deckt fast alle Geschäfte, aber nicht Grundstücksverkäufe."),
M(810,"bh","Was ist die Firma im rechtlichen Sinn?",["das Gebäude des Betriebs","der Name, unter dem ein Kaufmann seine Geschäfte betreibt","die Mitarbeiter","der Gewinn"],1,"§ 17 HGB."),
M(811,"bh","Wer zahlt Arbeitnehmern bei einer Insolvenz des Arbeitgebers für bis zu drei Monate den Lohn?",["die Agentur für Arbeit als Insolvenzgeld","die Krankenkasse","die Handwerkskammer","der Insolvenzverwalter aus eigener Tasche"],0,"Insolvenzgeld für die letzten drei Monate vor der Insolvenz."),
M(812,"bh","Wo meldet ein Handwerker ein Gewerbe an?",["beim Gewerbeamt der Gemeinde","beim Arbeitsgericht","bei der Gewerkschaft","bei der Polizei"],0,"Zusätzlich Eintragung in die Handwerksrolle und Anmeldung bei Finanzamt und Berufsgenossenschaft."),
M(813,"bh","Welche Kosten sind Fixkosten des Betriebs?",["Material für einen Auftrag","Miete für die Werkstatt","Fahrtkosten zu einer Baustelle","Löhne für Überstunden bei einem Auftrag"],1,"Fixkosten fallen unabhängig von der Auftragsmenge an."),
M(814,"bh","Was misst die Rentabilität?",["das Verhältnis von Gewinn zum eingesetzten Kapital","die Menge pro Arbeitsstunde","die Zahl der Mitarbeiter","die Höhe der Umsatzsteuer"],0,"Produktivität: Menge zu Einsatz. Wirtschaftlichkeit: Ertrag zu Aufwand."),
M(815,"bh","Wie berechnet sich der Gewinn?",["Umsatz plus Kosten","Umsatz minus Kosten","Kosten minus Steuern","Lohn mal Stunden"],1,"Der Gewinn ist der Lohn des Unternehmers für Risiko und Kapital."),

M(902,"wg","Die Nachfrage nach Wärmepumpen steigt stark, das Angebot bleibt gleich. Was passiert mit dem Preis?",["Er sinkt.","Er steigt.","Er bleibt immer gleich.","Der Staat muss ihn festlegen."],1,"Höhere Nachfrage bei gleichem Angebot führt zu höheren Preisen."),

M(905,"wg","In welcher Konjunkturphase ist die Arbeitslosigkeit meist am höchsten?",["Aufschwung","Hochkonjunktur (Boom)","Abschwung","Tiefstand (Rezession)"],3,"Phasen: Aufschwung, Boom, Abschwung, Tiefstand."),

M(907,"wg","Was geben private Haushalte im einfachen Wirtschaftskreislauf an Unternehmen ab?",["Steuern","Arbeitskraft","Subventionen","Güter"],1,"Dafür erhalten sie Einkommen, mit dem sie Güter kaufen."),

M(914,"wg","Warum lohnt es sich meist, Skonto zu nutzen, selbst wenn man dafür das Konto überziehen muss?",["Weil Skonto steuerfrei ist.","Weil der Skontovorteil, umgerechnet auf ein Jahr, meist höher ist als die Kreditzinsen.","Weil man sonst Strafe zahlt.","Weil der Lieferant es verlangt."],1,"2 % Skonto für 20 Tage früher entsprechen etwa 36 % Jahreszins."),

M(1002,"um","Wie muss der Betrieb gefährliche Abfälle wie Ölschlamm entsorgen?",["über den Hausmüll","über einen zugelassenen Entsorger mit Nachweis","in den Gully","auf der Baustelle vergraben"],1,"Für gefährliche Abfälle besteht eine Nachweispflicht."),

const Q = [
{n:1,p:"A",t:"mc",q:"Wer ist für die Gesellenprüfung von Paul zuständig?",o:["die Industrie- und Handelskammer","die Handwerkskammer, durchgeführt meist von der Innung","die Berufsschule","die Agentur für Arbeit"],a:1,w:"Im Handwerk ist die Handwerkskammer zuständig. Sie überträgt die Gesellenprüfung meist an die Innung. Die IHK ist für Industrie und Handel da."},
{n:2,p:"A",t:"mc",q:"Wie lange darf die Probezeit in der Berufsausbildung dauern?",o:["höchstens 6 Wochen","mindestens 1 Monat, höchstens 4 Monate","genau 6 Monate","mindestens 3 Monate, höchstens 12 Monate"],a:1,w:"§ 20 BBiG: mindestens 1 Monat, höchstens 4 Monate."},
{n:3,p:"A",t:"mc",q:"Paul ist nach der Probezeit und möchte die Ausbildung aufgeben, um einen anderen Beruf zu lernen. Mit welcher Frist kann er kündigen?",o:["fristlos","2 Wochen","4 Wochen","3 Monate zum Quartalsende"],a:2,w:"§ 22 BBiG: 4 Wochen, schriftlich und mit Grund, wenn er die Ausbildung aufgibt oder den Beruf wechselt."},
{n:4,p:"A",t:"mc",q:"Paul ist zu Beginn des Kalenderjahres 17 Jahre alt. Wie viele Werktage Urlaub stehen ihm nach dem Jugendarbeitsschutzgesetz mindestens zu?",o:["24 Werktage","25 Werktage","27 Werktage","30 Werktage"],a:1,w:"§ 19 JArbSchG: noch nicht 16 = 30, noch nicht 17 = 27, noch nicht 18 = 25 Werktage. Paul ist 17, also 25."},
{n:5,p:"A",t:"mc",q:"Wie oft muss Herr Weber den 17-jährigen Paul mindestens über Unfall- und Gesundheitsgefahren unterweisen?",o:["nur einmal bei der Einstellung","jährlich","halbjährlich","monatlich"],a:2,w:"§ 29 JArbSchG: vor Beginn und dann mindestens halbjährlich. Bei Erwachsenen reicht jährlich."},
{n:6,p:"A",t:"mc",q:"Wer zahlt die Beiträge zur gesetzlichen Unfallversicherung?",o:["Arbeitgeber und Arbeitnehmer je zur Hälfte","der Arbeitnehmer allein","der Arbeitgeber allein","der Staat aus Steuermitteln"],a:2,w:"Die Berufsgenossenschaft wird allein vom Arbeitgeber bezahlt."},
{n:7,p:"A",t:"mc",q:"Ab wie vielen ständigen wahlberechtigten Arbeitnehmern kann in einem Betrieb ein Betriebsrat gewählt werden?",o:["ab 3","ab 5","ab 10","ab 20"],a:1,w:"§ 1 BetrVG: ab 5 ständigen wahlberechtigten Arbeitnehmern, davon 3 wählbar."},
{n:8,p:"A",t:"mc",q:"Wer schließt einen Tarifvertrag ab?",o:["Betriebsrat und Arbeitgeber","Handwerkskammer und Berufsschule","Gewerkschaft und Arbeitgeberverband oder Innung","Bundesregierung und Gewerkschaft"],a:2,w:"Tarifparteien sind Gewerkschaft und Arbeitgeberverband. Im Handwerk oft die Innung oder der Landesinnungsverband."},
{n:9,p:"A",t:"mc",q:"Wie lange darf ein erwachsener Arbeitnehmer nach dem Arbeitszeitgesetz werktäglich höchstens arbeiten?",o:["8 Stunden, ohne Ausnahme","8 Stunden, verlängerbar auf 10 Stunden, wenn im Durchschnitt 8 Stunden nicht überschritten werden","10 Stunden, verlängerbar auf 12 Stunden","9 Stunden, ohne Ausnahme"],a:1,w:"§ 3 ArbZG: 8 Stunden, bis 10 Stunden, wenn im Schnitt von 6 Monaten 8 Stunden nicht überschritten werden."},
{n:10,p:"A",t:"mc",q:"Die Weber Haustechnik GmbH hat in einem Neubau die Heizung installiert. Der Vertrag wurde nach BGB geschlossen, nicht nach VOB. Wie lange gilt die Gewährleistung für diese Arbeiten am Bauwerk?",o:["6 Monate","2 Jahre","4 Jahre","5 Jahre"],a:3,w:"§ 634a BGB: Arbeiten an einem Bauwerk 5 Jahre ab Abnahme. Nach VOB/B wären es 4 Jahre."},
{n:11,p:"A",t:"mc",q:"Die Weber Haustechnik GmbH hat Schulden, die sie nicht bezahlen kann. Womit haftet sie gegenüber den Gläubigern?",o:["Herr Weber haftet mit seinem gesamten Privatvermögen","nur mit dem Gesellschaftsvermögen der GmbH","alle Mitarbeiter haften anteilig","die Handwerkskammer übernimmt die Schulden"],a:1,w:"Die GmbH haftet nur mit dem Gesellschaftsvermögen."},
{n:12,p:"A",t:"mc",q:"Wo muss Herr Weber seinen SHK-Betrieb eintragen lassen, damit er ihn führen darf?",o:["in die Handwerksrolle bei der Handwerkskammer","ins Grundbuch beim Amtsgericht","in die Mitgliederliste der Gewerkschaft","beim Finanzamt in die Steuerrolle"],a:0,w:"SHK ist ein zulassungspflichtiges Handwerk: Eintragung in die Handwerksrolle, in der Regel mit Meisterbrief."},
{n:13,p:"B",t:"open",q:"Pauls Ausbildungsvertrag regelt Rechte und Pflichten. Nenne drei Pflichten des Ausbildungsbetriebs und zwei Pflichten von Paul.",s:["Betrieb: ausbilden nach Ausbildungsrahmenplan, Werkzeug und Ausbildungsmittel kostenlos stellen, für Berufsschule und Prüfung freistellen, Vergütung zahlen, Berichtsheft kontrollieren, Zeugnis ausstellen, keine ausbildungsfremden Arbeiten.","Paul: Lernpflicht, Berufsschule besuchen, Berichtsheft führen, Weisungen befolgen, Betriebsordnung einhalten, sorgfältig mit Werkzeug umgehen, Schweigepflicht."],tip:"Je richtige Nennung 1 Punkt."},
{n:14,p:"B",t:"open",q:"Auf Pauls Lohnabrechnung stehen Beiträge zur Sozialversicherung. Nenne alle fünf Zweige der gesetzlichen Sozialversicherung.",s:["Krankenversicherung","Pflegeversicherung","Rentenversicherung","Arbeitslosenversicherung","Unfallversicherung (Berufsgenossenschaft)"],tip:"Je Zweig 1 Punkt."},
{n:15,p:"B",t:"open",q:"Paul erhält eine Bruttovergütung, ausgezahlt wird aber weniger. Nenne vier Abzüge, die vom Bruttobetrag abgehen können.",s:["Lohnsteuer, Kirchensteuer, Solidaritätszuschlag (nur noch bei hohen Einkommen)","Beiträge zur Kranken-, Pflege-, Renten- und Arbeitslosenversicherung"],tip:"Je Nennung 1,25 Punkte. Die Unfallversicherung ist kein Abzug, die zahlt der Arbeitgeber."},
{n:16,p:"B",t:"open",q:"Paul fährt morgens direkt von zu Hause zur Baustelle. Unterwegs stürzt er mit dem Fahrrad und verletzt sich am Handgelenk.<ul><li>a) Welche Versicherung ist zuständig, und wie nennt man diesen Unfall?</li><li>b) Was muss Paul nach dem Unfall tun? Nenne zwei Schritte.</li></ul>",s:["a) Gesetzliche Unfallversicherung, also die Berufsgenossenschaft. Es ist ein Wegeunfall.","b) Betrieb sofort informieren, zum Durchgangsarzt (D-Arzt) gehen und den Wegeunfall angeben, Eintrag ins Verbandbuch. Der Betrieb meldet ab mehr als 3 Tagen Arbeitsunfähigkeit eine Unfallanzeige."],tip:"a) 2 Punkte, b) 3 Punkte."},
{n:17,p:"B",t:"open",q:"Frau Schmitt ruft an und möchte ein neues Waschbecken eingebaut haben. Herr Weber schickt ihr ein schriftliches Angebot, und Frau Schmitt unterschreibt es. Erkläre, wie dadurch ein Vertrag zustande gekommen ist.",s:["Ein Vertrag entsteht durch zwei übereinstimmende Willenserklärungen.","Das Angebot von Herrn Weber ist der Antrag, die Unterschrift von Frau Schmitt die Annahme.","Es ist ein Werkvertrag. Der Anruf war nur eine Anfrage."],tip:"Willenserklärung 1 Punkt, Antrag und Annahme je 2 Punkte."},
{n:18,p:"B",t:"open",q:"Ein Kunde fragt Paul nach dem Unterschied zwischen Gewährleistung und Garantie. Erkläre den Unterschied.",s:["Gewährleistung: gesetzlich (BGB). Der Handwerker oder Verkäufer haftet für Mängel, die schon bei Übergabe oder Abnahme da waren.","Garantie: freiwillige Zusage, meist vom Hersteller, mit selbst festgelegter Dauer und Bedingungen. Gilt zusätzlich."],tip:"Je Begriff 2,5 Punkte. Merksatz: Gewährleistung = Gesetz, Garantie = Geschenk."},
{n:19,p:"B",t:"calc",q:"Kalkuliere den Preis für einen Badumbau.<ul><li>Materialkosten: 1.500 €</li><li>Lohnkosten: 1.000 €</li><li>Gemeinkosten: 60 % der Lohnkosten</li><li>Gewinnzuschlag: 10 % auf die Selbstkosten</li><li>Umsatzsteuer: 19 %</li></ul>",f:[["Selbstkosten",3100],["Nettopreis",3410],["Bruttopreis",4057.90]],s:["Gemeinkosten: 60 % von 1.000 € = 600 €","Selbstkosten: 1.500 + 1.000 + 600 = 3.100,00 €","Gewinn: 10 % von 3.100 € = 310 €, Nettopreis 3.410,00 €","Umsatzsteuer: 19 % von 3.410 € = 647,90 €, Bruttopreis 4.057,90 €"],tip:"Typischer Fehler: Gemeinkosten auf Material und Lohn rechnen. Hier nur auf den Lohn."},
{n:20,p:"B",t:"open",q:"Bei einer Heizungssanierung baut Paul einen alten Ölkessel und den Öltank aus. Nenne zwei Maßnahmen, mit denen der Betrieb die Altteile und Reststoffe umweltgerecht entsorgt.",s:["Restöl und Ölschlamm von einem zugelassenen Fachbetrieb absaugen und den Tank reinigen lassen (gefährlicher Abfall), Entsorgungsnachweis aufbewahren.","Metallteile sortenrein zum Schrotthändler ins Recycling, Abfälle getrennt sammeln, Pumpe und Regelung als Elektroschrott."],tip:"2 Maßnahmen, je 2,5 Punkte."},
{n:21,p:"C",t:"mc",q:"Paul hat am Dienstag von 8:00 bis 13:15 Uhr Berufsschule mit sechs Unterrichtsstunden zu je 45 Minuten. Es ist sein einziger langer Schultag in der Woche. Muss er danach noch in den Betrieb?",o:["Ja, er muss die restliche Arbeitszeit im Betrieb nachholen.","Ja, aber nur bis 16:00 Uhr.","Nein, der Tag wird mit der durchschnittlichen täglichen Arbeitszeit angerechnet.","Nein, aber er muss die Stunden am Samstag nacharbeiten."],a:2,w:"§ 9 JArbSchG: Einmal pro Woche bei mehr als 5 Unterrichtsstunden zu 45 Minuten darf ein Jugendlicher danach nicht mehr arbeiten. Der Tag zählt mit 8 Stunden."},
{n:22,p:"C",t:"mc",q:"Paul, 17, arbeitet an einem Tag 7,5 Stunden. Wie lange müssen seine Ruhepausen insgesamt mindestens sein?",o:["15 Minuten","30 Minuten","45 Minuten","60 Minuten"],a:3,w:"§ 11 JArbSchG: mehr als 4,5 bis 6 Stunden = 30 Minuten, mehr als 6 Stunden = 60 Minuten. Erwachsene bräuchten nur 30."},
{n:23,p:"C",t:"mc",q:"Welche Arbeitszeit gilt nach dem Jugendarbeitsschutzgesetz grundsätzlich für den 17-jährigen Paul?",o:["höchstens 8 Stunden täglich und 40 Stunden wöchentlich","höchstens 10 Stunden täglich und 48 Stunden wöchentlich","höchstens 9 Stunden täglich und 45 Stunden wöchentlich","höchstens 6 Stunden täglich und 30 Stunden wöchentlich"],a:0,w:"§ 8 JArbSchG: 8 Stunden täglich, 40 Stunden pro Woche."},
{n:24,p:"C",t:"mc",q:"Paul hat bis 18:00 Uhr auf einer Baustelle gearbeitet. Wann darf er am nächsten Tag frühestens wieder beschäftigt werden?",o:["um 5:00 Uhr","um 6:00 Uhr","um 7:00 Uhr, wegen der Nachtruhe","sofort, es gibt keine Regel"],a:1,w:"§ 13 JArbSchG: mindestens 12 Stunden Freizeit. 18 Uhr + 12 Stunden = 6 Uhr, passend zur Nachtruhe 20 bis 6 Uhr."},
{n:25,p:"C",t:"mc",q:"Die Weber Haustechnik GmbH hat drei Auszubildende und keine weiteren Beschäftigten unter 18. Ein Betriebsrat besteht. Kann eine Jugend- und Auszubildendenvertretung gewählt werden?",o:["Ja, in jedem Betrieb mit Auszubildenden.","Nein, dafür sind mindestens fünf Jugendliche oder Auszubildende unter 25 nötig.","Ja, wenn Herr Weber zustimmt.","Nein, eine JAV gibt es nur bei der Handwerkskammer."],a:1,w:"§ 60 BetrVG: mindestens 5 Jugendliche oder Azubis unter 25, und ein Betriebsrat muss bestehen."},
{n:26,p:"C",t:"mc",q:"Was bedeutet die Friedenspflicht während der Laufzeit eines Tarifvertrags?",o:["Im Betrieb darf nicht gestritten werden.","Zu den geregelten Inhalten dürfen keine Streiks oder Aussperrungen stattfinden.","Der Arbeitgeber darf niemandem kündigen.","Der Betriebsrat darf keine Beschwerden einreichen."],a:1,w:"Während der Laufzeit sind Arbeitskämpfe über die geregelten Inhalte verboten."},
{n:27,p:"C",t:"mc",q:"Ein Tarifvertrag wird für allgemeinverbindlich erklärt. Was ist die Folge?",o:["Er gilt nur für Gewerkschaftsmitglieder.","Er gilt im Geltungsbereich auch für Arbeitgeber und Arbeitnehmer, die nicht tarifgebunden sind.","Er gilt nur für Betriebe mit Betriebsrat.","Er ersetzt alle Gesetze zum Arbeitsrecht."],a:1,w:"Dann gilt er für alle Betriebe der Branche im Geltungsbereich, auch ohne Mitgliedschaft."},
{n:28,p:"C",t:"mc",q:"Ein Geselle der Firma Weber kommt wiederholt zu spät. Herr Weber erteilt ihm eine Abmahnung. Welchen Zweck hat sie?",o:["Sie ist bereits die Kündigung.","Sie rügt das Fehlverhalten und warnt vor einer Kündigung im Wiederholungsfall.","Sie führt automatisch zu einer Lohnkürzung.","Sie muss von der Handwerkskammer genehmigt werden."],a:1,w:"Die Abmahnung rügt und warnt. Sie ist meist Voraussetzung für eine verhaltensbedingte Kündigung."},
{n:29,p:"C",t:"mc",q:"Herr Weber möchte einem Gesellen nach der Probezeit ordentlich kündigen. Der Geselle ist seit einem Jahr im Betrieb. Welche gesetzliche Grundkündigungsfrist gilt?",o:["2 Wochen","4 Wochen zum 15. oder zum Ende eines Kalendermonats","3 Monate zum Quartalsende","6 Monate zum Jahresende"],a:1,w:"§ 622 BGB: 4 Wochen zum 15. oder Monatsende. Länger wird es erst ab 2 Jahren Betriebszugehörigkeit."},
{n:30,p:"C",t:"mc",q:"Die Firma Weber hat 12 Beschäftigte in Vollzeit, davon 3 Auszubildende. Gilt das Kündigungsschutzgesetz für einen Gesellen, der seit zwei Jahren im Betrieb ist?",o:["Ja, weil der Betrieb mehr als 10 Beschäftigte hat.","Ja, weil er länger als 6 Monate im Betrieb ist.","Nein, weil Auszubildende nicht mitgezählt werden und nur 9 Arbeitnehmer bleiben.","Nein, für Handwerksbetriebe gilt es nie."],a:2,w:"§ 23 KSchG: gilt erst ab mehr als 10 Arbeitnehmern, Azubis zählen nicht. 12 − 3 = 9."},
{n:31,p:"C",t:"mc",q:"Wie wird die gesetzliche Rentenversicherung finanziert?",o:["Jeder spart seine eigene Rente an, die später ausgezahlt wird.","Im Umlageverfahren: Die heutigen Beitragszahler finanzieren die heutigen Renten.","Allein aus der Lohnsteuer.","Allein durch die Arbeitgeber."],a:1,w:"Umlageverfahren (Generationenvertrag), ergänzt durch einen Bundeszuschuss."},
{n:32,p:"C",t:"mc",q:"Paul ist acht Wochen krankgeschrieben. Wer zahlt ihm ab der siebten Woche Geld?",o:["der Ausbildungsbetrieb weiter in voller Höhe","die Krankenkasse in Form von Krankengeld","die Berufsgenossenschaft","die Agentur für Arbeit"],a:1,w:"6 Wochen Entgeltfortzahlung durch den Betrieb, danach Krankengeld von der Krankenkasse."},
{n:33,p:"C",t:"calc",q:"Eine Kundin zahlt für eine Reparatur 5.950 € brutto. Berechne den Nettobetrag und die enthaltene Umsatzsteuer von 19 %.",f:[["Nettobetrag",5000],["Umsatzsteuer",950]],s:["Brutto = 119 %, also Netto = 5.950 € ÷ 1,19 = 5.000,00 €","Umsatzsteuer = 5.950 € − 5.000 € = 950,00 €"],tip:"Falle: 19 % von 5.950 € (= 1.130,50 €) ist falsch, weil die Steuer auf den Nettobetrag gerechnet wird."},
{n:34,p:"C",t:"calc",q:"Eine Rechnung über 2.380 € brutto wird innerhalb von 10 Tagen mit 2 % Skonto bezahlt. Berechne den Skontobetrag und den Zahlbetrag.",f:[["Skontobetrag",47.60],["Zahlbetrag",2332.40]],s:["Skonto = 2 % von 2.380 € = 47,60 €","Zahlbetrag = 2.380 € − 47,60 € = 2.332,40 €"]},
{n:35,p:"C",t:"calc",q:"Ein Geselle verdient 22 € pro Stunde. Die Gemeinkosten betragen 120 % des Lohns, der Gewinnzuschlag 10 %. Berechne den Stundenverrechnungssatz netto und brutto mit 19 % Umsatzsteuer.",f:[["Stundenverrechnungssatz netto",53.24],["Stundenverrechnungssatz brutto",63.36]],s:["Gemeinkosten: 120 % von 22 € = 26,40 €, Selbstkosten 48,40 €","Gewinn: 10 % von 48,40 € = 4,84 €, netto 53,24 €","Brutto: 53,24 € × 1,19 = 63,36 €"]},
{n:36,p:"C",t:"open",q:"Drei Monate nach dem Einbau meldet Frau Schmitt, dass der neue Waschtisch-Siphon tropft. Erkläre, welches Recht der Betrieb zuerst hat und welche Rechte die Kundin hat, wenn das scheitert.",s:["Zuerst hat der Betrieb das Recht auf Nacherfüllung. Beim Werkvertrag wählt der Betrieb: nachbessern oder neu herstellen. Die Kundin setzt eine angemessene Frist.","Scheitert das: Selbstvornahme mit Kostenersatz, Rücktritt, Minderung und gegebenenfalls Schadensersatz, zum Beispiel für einen Wasserschaden."],tip:"Nacherfüllung 2 Punkte, zwei weitere Rechte je 1,5 Punkte."},
{n:37,p:"C",t:"open",q:"Erkläre den Unterschied zwischen einem Kaufvertrag und einem Werkvertrag. Ordne zu, welcher Vertrag beim Einbau einer neuen Heizung vorliegt.",s:["Kaufvertrag: Übergabe einer Sache und Eigentumsverschaffung gegen Kaufpreis.","Werkvertrag: Der Unternehmer schuldet einen Erfolg, also ein fertiges, funktionierendes Werk. Der Kunde zahlt und nimmt ab.","Heizungseinbau = Werkvertrag."],tip:"Erklärung je 2 Punkte, Zuordnung 1 Punkt."},
{n:38,p:"C",t:"open",q:"Herr Weber überlegt, ob er sein Einzelunternehmen in eine GmbH umwandeln soll. Nenne zwei Unterschiede zwischen Einzelunternehmen und GmbH.",s:["Haftung: Einzelunternehmer haftet auch mit Privatvermögen, GmbH nur mit Gesellschaftsvermögen.","Kapital: Einzelunternehmen ohne Mindestkapital, GmbH 25.000 € Stammkapital.","Gründung: GmbH braucht notariellen Vertrag und Handelsregister. Leitung durch Geschäftsführer."],tip:"Je Unterschied 2,5 Punkte. Haftung ist der wichtigste."},
{n:39,p:"C",t:"open",q:"Der Betriebsrat hat bei manchen Entscheidungen ein Mitbestimmungsrecht. Nenne zwei solche Angelegenheiten.",s:["Beginn und Ende der Arbeitszeit und der Pausen, Überstunden oder Kurzarbeit, Urlaubsplan, Betriebsordnung, technische Überwachung wie GPS im Firmenwagen, Lohngestaltung, Arbeitsschutz (§ 87 BetrVG)."],tip:"Je Nennung 2,5 Punkte. Bei Kündigungen wird der Betriebsrat nur angehört."},
{n:40,p:"C",t:"open",q:"Paul möchte sich nach der Gesellenprüfung weiterbilden. Nenne zwei Weiterbildungsmöglichkeiten und eine Möglichkeit der finanziellen Förderung.",s:["Weiterbildung: Installateur- und Heizungsbauermeister, staatlich geprüfter Techniker, Gebäudeenergieberater im Handwerk, Kundendiensttechniker, Studium Versorgungstechnik.","Förderung: Aufstiegs-BAföG, Weiterbildungsstipendium, Bildungsurlaub in Hessen, Zuschuss vom Arbeitgeber."],tip:"Zwei Weiterbildungen je 1,5 Punkte, eine Förderung 2 Punkte."}
];

M(2104,"wp","Was bedeutet ein COP von 4?",["Die Wärmepumpe hat 4 kW.","Aus 1 kWh Strom werden in diesem Betriebspunkt 4 kWh Wärme.","Sie arbeitet bei 4 °C Außentemperatur.","Sie braucht 4 kWh Strom für 1 kWh Wärme."],1,"COP = Wärmeleistung ÷ elektrische Leistung, gemessen in einem Betriebspunkt."),

// ---------- Rechenaufgaben mit Zufallswerten ----------
const r = (a,b,step=1) => { const n=Math.round((b-a)/step); return +(a + step*Math.floor(Math.random()*(n+1))).toFixed(6); };
const pick = a => a[Math.floor(Math.random()*a.length)];
const f = (x,d=2) => Number(x).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const fi = x => Number(x).toLocaleString("de-DE",{maximumFractionDigits:3});
const CALC = [
 {id:"waerme", grp:"Wärme und Energie", name:"Wärmemenge", gen(){ const m=r(100,500,50), t1=r(10,15), t2=r(45,65,5), Q=m*1.163*(t2-t1)/1000;
   return {q:`Ein Speicher mit ${m} l Wasser wird von ${t1} °C auf ${t2} °C erwärmt. Wie groß ist die Wärmemenge?`, unit:"kWh", ans:Q, dec:2,
   formel:"Q = m × c × Δθ   (c = 1,163 Wh/(kg·K))", steps:[`Δθ = ${t2} − ${t1} = ${t2-t1} K`,`Q = ${m} kg × 1,163 Wh/(kg·K) × ${t2-t1} K = ${f(m*1.163*(t2-t1),1)} Wh`,`In kWh umrechnen: ÷ 1.000 = ${f(Q)} kWh`]}; }},
 {id:"gas", grp:"Wärme und Energie", name:"Gasmenge mit Umrechnung", gen(){ const Q=r(6000,30000,250), eta=pick([0.9,0.95,0.98,1]), H=10, V=Q/1000/(H*eta);
   return {q:`Für das Aufheizen werden ${fi(Q)} Wh Wärme gebraucht. Wie viel Erdgas (Hᵢ = 10 kWh/m³) braucht man bei einem Wirkungsgrad von ${Math.round(eta*100)} %?`, unit:"m³", ans:V, dec:2,
   formel:"V = Q ÷ (Hᵢ × η)   Achtung: erst Wh in kWh umrechnen!", steps:[`Q = ${fi(Q)} Wh = ${f(Q/1000,3)} kWh`,`η = ${Math.round(eta*100)} % = ${f(eta)}`,`V = ${f(Q/1000,3)} kWh ÷ (10 kWh/m³ × ${f(eta)}) = ${f(V)} m³`,"Plausibel? 1 m³ Erdgas ≈ 10 kWh."]}; }},
 {id:"oel", grp:"Wärme und Energie", name:"Heizölbedarf im Jahr", gen(){ const P=r(8,25), t=r(1600,2200,100), eta=pick([0.9,0.92,0.95,0.96]), B=P*t/(10*eta);
   return {q:`Ein Haus hat ${P} kW Heizlast und ${fi(t)} Vollbenutzungsstunden. Der Kessel hat ${Math.round(eta*100)} % Wirkungsgrad, Heizöl hat Hᵢ = 10 kWh/l. Wie viel Heizöl braucht man im Jahr?`, unit:"l", ans:B, dec:0,
   formel:"B = Q̇ × t ÷ (Hᵢ × η)", steps:[`Jahreswärme: ${P} kW × ${fi(t)} h = ${fi(P*t)} kWh`,`B = ${fi(P*t)} kWh ÷ (10 kWh/l × ${f(eta)}) = ${f(B,0)} l`]}; }},
 {id:"kosten", grp:"Wärme und Energie", name:"Energiekosten", gen(){ const W=r(300,2500,50), p=r(6,14,0.5), K=W*p/100;
   return {q:`Es werden ${fi(W)} kWh Gas verbraucht. Eine kWh kostet ${f(p,1)} ct. Wie hoch sind die Kosten?`, unit:"€", ans:K, dec:2,
   formel:"Kosten = Energie × Preis   (ct in € umrechnen)", steps:[`${f(p,1)} ct = ${f(p/100,3)} €`,`${fi(W)} kWh × ${f(p/100,3)} €/kWh = ${f(K)} €`]}; }},
 {id:"cop", grp:"Wärme und Energie", name:"Wärmepumpe: COP und JAZ", gen(){ if(Math.random()<.5){ const c=r(3,5.5,0.1), P=r(1.2,3,0.1), Q=c*P;
   return {q:`Eine Wärmepumpe hat einen COP von ${f(c,1)} und nimmt ${f(P,1)} kW elektrisch auf. Wie groß ist ihre Wärmeleistung?`, unit:"kW", ans:Q, dec:1, formel:"Q̇ = COP × P_el", steps:[`Q̇ = ${f(c,1)} × ${f(P,1)} kW = ${f(Q,1)} kW`]}; }
   const W=r(2500,6000,100), Q=W*r(3,5,0.1);
   return {q:`Eine Wärmepumpe gibt im Jahr ${fi(Math.round(Q))} kWh Wärme ab und braucht dafür ${fi(W)} kWh Strom. Wie groß ist die Jahresarbeitszahl?`, unit:"", ans:Math.round(Q)/W, dec:2, formel:"JAZ = Wärme im Jahr ÷ Strom im Jahr", steps:[`JAZ = ${fi(Math.round(Q))} ÷ ${fi(W)} = ${f(Math.round(Q)/W)}`]}; }},
 {id:"mischw", grp:"Trinkwasser", name:"Mischwasser: Warmwasseranteil", gen(){ const m=r(30,180,10), tk=r(8,15), tw=r(50,65,5), tm=r(36,42); const x=m*(tm-tk)/(tw-tk);
   return {q:`Eine Wanne soll ${m} l Wasser mit ${tm} °C enthalten. Kaltwasser hat ${tk} °C, Warmwasser ${tw} °C. Wie viel Warmwasser wird gebraucht?`, unit:"l", ans:x, dec:1,
   formel:"m_w = m_M × (θ_M − θ_K) ÷ (θ_W − θ_K)", steps:[`m_w = ${m} × (${tm} − ${tk}) ÷ (${tw} − ${tk})`,`m_w = ${m} × ${tm-tk} ÷ ${tw-tk} = ${f(x,1)} l`,`Kaltwasser: ${m} − ${f(x,1)} = ${f(m-x,1)} l`]}; }},
 {id:"mischk", grp:"Trinkwasser", name:"Mischwasser: Kaltwasseranteil", gen(){ const m=r(30,180,10), tk=r(8,15), tw=r(50,65,5), tm=r(36,42); const x=m*(tw-tm)/(tw-tk);
   return {q:`Für ${m} l Mischwasser mit ${tm} °C werden Kaltwasser mit ${tk} °C und Warmwasser mit ${tw} °C gemischt. Wie viel Kaltwasser wird gebraucht?`, unit:"l", ans:x, dec:1,
   formel:"m_k = m_M × (θ_W − θ_M) ÷ (θ_W − θ_K)", steps:[`m_k = ${m} × (${tw} − ${tm}) ÷ (${tw} − ${tk})`,`m_k = ${m} × ${tw-tm} ÷ ${tw-tk} = ${f(x,1)} l`]}; }},
 {id:"dle", grp:"Trinkwasser", name:"Leistung Durchlauferhitzer", gen(){ const v=pick([5,6,7,8,9,10,12]), d=r(25,40,5), P=v*60*1.163*d/1000;
   return {q:`Eine Brause hat ${v} l/min. Das Wasser soll um ${d} K erwärmt werden. Welche Leistung braucht der Durchlauferhitzer?`, unit:"kW", ans:P, dec:1,
   formel:"P = V̇ × c × Δθ   (V̇ in l/h)", steps:[`${v} l/min × 60 = ${v*60} l/h`,`P = ${v*60} × 1,163 × ${d} = ${f(P*1000,0)} W = ${f(P,1)} kW`]}; }},
 {id:"aufheiz", grp:"Trinkwasser", name:"Aufheizleistung Speicher", gen(){ const m=r(100,300,50), t1=r(10,15), t2=r(55,60,5), h=pick([1,1.5,2,3]), P=m*1.163*(t2-t1)/h/1000;

   formel:"P = m × c × Δθ ÷ t", steps:[`Q = ${m} × 1,163 × ${t2-t1} = ${f(m*1.163*(t2-t1),0)} Wh`,`P = ${f(m*1.163*(t2-t1),0)} Wh ÷ ${f(h,1)} h = ${f(P*1000,0)} W = ${f(P)} kW`]}; }},
 {id:"fuell", grp:"Trinkwasser", name:"Füllzeit", gen(){ const V=r(80,240,10), q=r(10,25); return {q:`Eine Badewanne mit ${V} l wird mit ${q} l/min gefüllt. Wie lange dauert das?`, unit:"min", ans:V/q, dec:1, formel:"t = V ÷ V̇", steps:[`t = ${V} l ÷ ${q} l/min = ${f(V/q,1)} min`]}; }},
 {id:"zyl", grp:"Trinkwasser", name:"Speichervolumen (Zylinder)", gen(){ const d=r(0.5,0.8,0.05), h=r(1.2,1.9,0.1), V=Math.PI/4*d*d*h*1000;

   formel:"V = π ÷ 4 × d² × h   (1 m³ = 1.000 l)", steps:[`V = 0,785 × ${f(d)}² × ${f(h,1)} = ${f(V/1000,3)} m³`,`= ${f(V,0)} l`]}; }},
 {id:"rohrinh", grp:"Trinkwasser", name:"Wasserinhalt einer Leitung", gen(){ const d=pick([13,16,20,26]), L=r(5,30), V=Math.PI/4*(d/100)**2*L*100;
   return {q:`Eine Leitung mit ${d} mm Innendurchmesser ist ${L} m lang. Wie viel Liter Wasser stehen darin?`, unit:"l", ans:V, dec:2,
   formel:"V = A × L   (in dm rechnen, dann sind es Liter)", steps:[`d = ${d} mm = ${f(d/100,2)} dm, L = ${L} m = ${L*10} dm`,`A = 0,785 × ${f(d/100,2)}² = ${f(Math.PI/4*(d/100)**2,4)} dm²`,`V = ${f(Math.PI/4*(d/100)**2,4)} × ${L*10} = ${f(V)} l`,"Mehr als 3 l bis zur Zapfstelle? Dann gilt die 3-Liter-Regel."]}; }},
 {id:"mstrom", grp:"Heizung", name:"Massenstrom", gen(){ const Q=r(400,3000,100), d=pick([5,10,15,20]), m=Q/(1.163*d);

 {id:"vgeschw", grp:"Heizung", name:"Strömungsgeschwindigkeit", gen(){ const d=pick([13,16,20,26,32]), V=r(0.2,2,0.1), v=V/3600/(Math.PI/4*(d/1000)**2);

   formel:"v = V̇ ÷ A   (V̇ in m³/s, A in m²)", steps:[`A = 0,785 × (${f(d/1000,3)} m)² = ${(Math.PI/4*(d/1000)**2).toExponential(3).replace(".",",")} m²`,`V̇ = ${f(V,1)} ÷ 3.600 = ${f(V/3600,6)} m³/s`,`v = ${f(v)} m/s`]}; }},
 {id:"heizlast", grp:"Heizung", name:"Heizlast überschlägig", gen(){ const A=r(60,180,0.5), q=r(30,90,5), P=A*q/1000;

 {id:"mag", grp:"Heizung", name:"MAG-Vordruck", gen(){ const h=r(4,22,0.5), p=h/10+0.2; return {q:`Die statische Höhe einer Heizungsanlage beträgt ${f(h,1)} m. Welchen Vordruck braucht das MAG?`, unit:"bar", ans:p, dec:2, formel:"p₀ = h ÷ 10 + 0,2 bar", steps:[`p₀ = ${f(h,1)} ÷ 10 + 0,2 = ${f(p)} bar`]}; }},
 {id:"druck", grp:"Heizung", name:"Druck aus Wassersäule", gen(){ const h=r(3,45); return {q:`Wie groß ist der statische Druck einer Wassersäule von ${h} m ungefähr?`, unit:"bar", ans:h/10, dec:1, formel:"10 m Wassersäule ≈ 1 bar", steps:[`p = ${h} ÷ 10 = ${f(h/10,1)} bar`]}; }},
 {id:"fbhlen", grp:"Heizung", name:"Rohrlänge Fußbodenheizung", gen(){ const A=r(8,40,0.5), va=pick([0.1,0.15,0.2]), L=A/va;

 {id:"fbhtemp", grp:"Heizung", name:"Oberflächentemperatur Fußboden", gen(){ const q=r(30,95,5), ti=pick([20,22,24]), t=ti+q/11;

 {id:"luft", grp:"Heizung", name:"Luftvolumenstrom", gen(){ const l=r(2,5,0.5), b=r(2,4,0.5), h=r(2.4,2.7,0.1), n=pick([0.5,1,2,3,4]), V=l*b*h*n;

 {id:"gefaelle", grp:"Sanitär", name:"Gefälle Abwasserleitung", gen(){ const L=r(1,9,0.5), p=pick([0.5,1,1.5,2]), h=L*p;

 {id:"laenge", grp:"Sanitär", name:"Längenausdehnung", gen(){ const mat=pick([["Kupfer",0.017],["Stahl",0.012],["PE-X",0.15],["Mehrschichtverbund",0.025]]), l=r(5,25), d=r(30,60,5), dl=mat[1]*l*d;

 {id:"flaeche", grp:"Sanitär", name:"Fliesenfläche", gen(){ const L=r(2,5,0.5), H=r(2,2.75,0.25), tb=pick([0.8,0.9]), th=2.0, A=L*H-tb*th;

 {id:"netto", grp:"Kalkulation", name:"Netto aus Brutto", gen(){ const N=r(200,9000,50), B=N*1.19; return {q:`Ein Kunde zahlt ${f(B)} € brutto. Wie hoch ist der Nettobetrag (19 % USt)?`, unit:"€", ans:N, dec:2, formel:"Netto = Brutto ÷ 1,19", steps:[`Netto = ${f(B)} ÷ 1,19 = ${f(N)} €`,"Nicht 19 % vom Brutto abziehen!"]}; }},
 {id:"skonto", grp:"Kalkulation", name:"Skonto", gen(){ const B=r(300,6000,10), s=pick([2,3]), Z=B*(1-s/100); return {q:`Eine Rechnung über ${f(B)} € wird mit ${s} % Skonto bezahlt. Wie hoch ist der Zahlbetrag?`, unit:"€", ans:Z, dec:2, formel:"Zahlbetrag = Betrag − Skonto", steps:[`Skonto = ${s} % von ${f(B)} = ${f(B*s/100)} €`,`Zahlbetrag = ${f(Z)} €`]}; }},

 {id:"kalk", grp:"Kalkulation", name:"Angebotspreis brutto", gen(){ const M=r(500,4000,50), L=r(300,2500,50), gk=pick([40,50,60,80]), g=pick([5,10,15]), S=M+L*(1+gk/100), B=S*(1+g/100)*1.19;

let CALC_BY, CALC_GROUPS;
function numIn(str){ let s=String(str||"").replace(/[^\d,.\-]/g,""); if(!s) return NaN; if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,""); return Number(s); }
function calcOk(t, v){ const x=numIn(v); if(isNaN(x)) return false; const tol=Math.max(Math.abs(t.ans)*0.015, 0.5*Math.pow(10,-t.dec)); return Math.abs(x-t.ans)<=tol+1e-9; }
function makeTask(id){ const c=CALC_BY[id], t=c.gen(); return {...t, id, name:c.name, grp:c.grp}; }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rec(id){ return P.q[id]; }
function status(id){ const r=rec(id); if(!r) return "new"; if(r.last===0) return "wrong"; return r.lv>=2 ? "sure" : "learned"; }
function record(id, ok){
  const r = P.q[id] || (P.q[id] = {lv:0,n:0,ok:0});
  r.n++; if(ok){ r.ok++; r.lv=Math.min(r.lv+1,3); r.last=1; } else { r.lv=0; r.last=0; }
  const d=today(); P.day[d]=(P.day[d]||0)+1;
}
function stats(ids){
  const s={new:0,wrong:0,learned:0,sure:0,total:ids.length};
  ids.forEach(id=>s[status(id)]++); return s;
}

function pickRound(ids, n){
  const pr = {wrong:0,new:1,learned:2,sure:3};
  const sorted = shuffle(ids).sort((a,b)=>pr[status(a)]-pr[status(b)]);
  return shuffle(sorted.slice(0,n));
}

  let s=0; const d=new Date();

  for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(P.day[k]) { s++; d.setDate(d.getDate()-1); } else break; }
  return s;
}
function grade(p){ return p>=92?"sehr gut":p>=81?"gut":p>=67?"befriedigend":p>=50?"ausreichend":p>=30?"mangelhaft":"ungenügend"; }
function daysLeft(){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((EXAM_DATE-t)/86400000); }

// ---------- sessions ----------
function startSession(kind, title, ids, opts={}){
  const perm={}; if(!opts.fixed) ids.forEach(id=>perm[id]=shuffle([0,1,2,3]));
  P.sess = {kind, title, ids, i:0, ans:{}, perm, start:Date.now(), dur:(opts.min||0)*60000, done:false, preset:opts.preset||null};
  save(); V="quiz"; render(); scrollTo({top:0});
}
function learnTopics(topics, title){
  const ids = pickRound(idsOf(topics), ROUND);
  startSession("learn", title, ids);
}
function smartRound(){ startSession("learn","Weiterlernen", pickRound(CORE.map(q=>q.n), ROUND)); }
function wrongRound(){ const w=BANK.filter(q=>status(q.n)==="wrong").map(q=>q.n); if(w.length) startSession("learn","Fehlertraining", shuffle(w).slice(0,20)); }
function markedRound(){ const m=Object.keys(P.mark).filter(k=>P.mark[k]&&BY[k]).map(Number); if(m.length) startSession("learn","Markierte Fragen", shuffle(m)); }
function startExam(pr){
  let ids = pr.pool().map(q=>q.n);
  if(!pr.fixed) ids = shuffle(ids).slice(0,pr.n);
  startSession("exam", pr.name, ids, {min:pr.min, fixed:pr.fixed, preset:pr.id});
}
function finishExam(){
  const S=P.sess; if(S.done) return;
  S.done=true;
  let ok=0; S.ids.forEach(id=>{ const c=S.ans[id]; const r = c===BY[id].a; if(r) ok++; record(id, r); });
  P.hist.unshift({p:S.preset, name:S.title, ok, n:S.ids.length, d:today()}); P.hist=P.hist.slice(0,30);
  save(); V="result"; render(); scrollTo({top:0});
}

function calcBind(){
  const on=(id,fn)=>{ const e=$(id); if(e) e.onclick=fn; };
  on("calcMix", ()=>startCalc("Gemischte Rechenaufgaben", shuffle(CALC.map(c=>c.id)).slice(0,10)));
  document.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>startCalc(CALC_BY[b.dataset.calc].name, Array(5).fill(b.dataset.calc)));
  document.querySelectorAll("[data-cgrp]").forEach(b=>b.onclick=()=>{ const ids=CALC.filter(c=>c.grp===b.dataset.cgrp).map(c=>c.id); startCalc(b.dataset.cgrp, shuffle(ids.concat(ids)).slice(0,8)); });
  on("cmenu", ()=>{ V="calc"; render(); scrollTo({top:0}); });
  on("cagain", ()=>{ const S=P.sess; startCalc(S.title, shuffle(S.types)); });
  const S=P.sess; if(V!=="quiz" || !S || S.kind!=="calc") return;
  const inp=$("cval"); if(inp){ inp.oninput=()=>{ S.ans[S.i]=inp.value; save(); }; inp.onkeydown=e=>{ if(e.key==="Enter" && $("ccheck")) $("ccheck").click(); }; }
  on("chint", ()=>{ S.hint[S.i]=true; save(); render(); });
  on("ccheck", ()=>{
    const t=S.tasks[S.i]; if(isNaN(numIn(S.ans[S.i]))){ inp.focus(); inp.placeholder="Bitte eine Zahl eingeben"; return; }
    S.chk[S.i]=true; const ok=calcOk(t,S.ans[S.i]);
    const r=P.calc[t.id]||(P.calc[t.id]={n:0,ok:0}); r.n++; if(ok) r.ok++;
    const d=today(); P.day[d]=(P.day[d]||0)+1; save(); render();
  });
  on("cnext", ()=>{ if(S.i<S.tasks.length-1){ S.i++; save(); render(); scrollTo({top:0}); } else { S.done=true; save(); V="result"; render(); scrollTo({top:0}); } });
  on("cquit", ()=>{
    $("quitAsk").innerHTML=`<div class="notice"><p>Rechnen beenden? Deine Ergebnisse sind gespeichert.</p><button class="btn primary" id="qOk">Beenden</button><button class="btn" id="qNo">Weiter rechnen</button></div>`;
    on("qOk", ()=>{ S.done=true; save(); V="calc"; render(); }); on("qNo", ()=>{ $("quitAsk").innerHTML=""; });
  });
}

  .map(([dn,inch,od,w])=>({dn,inch,od,w,di:+(od-2*w).toFixed(1)}));
const REF_THR = [["1/8",9.728,28],["1/4",13.157,19],["3/8",16.662,19],["1/2",20.955,14],["3/4",26.441,14],["1",33.249,11],
  ["1 1/4",41.910,11],["1 1/2",47.803,11],["2",59.614,11],["2 1/2",75.184,11],["3",87.884,11],["4",113.030,11]];
const REF_COL = [[1,"Wasser","Grün","#237f52"],[2,"Wasserdampf","Rot","#a72920"],[3,"Luft","Grau","#9b9b9b"],
  [4,"Brennbare Gase","Gelb, Zusatzfarbe Rot","#f6b600","#a72920"],[5,"Nicht brennbare Gase","Gelb, Zusatzfarbe Schwarz","#f6b600","#0e0e10"],
  [6,"Säuren","Orange","#d05d28"],[7,"Laugen","Violett","#904684"],[8,"Brennbare Flüssigkeiten","Braun, Zusatzfarbe Rot","#9c6b30","#a72920"],
  [9,"Nicht brennbare Flüssigkeiten","Braun, Zusatzfarbe Schwarz","#9c6b30","#0e0e10"],[0,"Sauerstoff","Blau","#1e5a9a"]];
const REF_ALPHA = [["Stahl",0.012],["Edelstahl",0.016],["Kupfer",0.017],["Mehrschichtverbundrohr",0.025],["PVC-U",0.08],["PP-R",0.15],["PE-X",0.15],["PE-HD",0.2]];
const REF_UNITS = [["1 bar","100.000 Pa = 1.000 hPa = 100 kPa"],["1 bar","≈ 10,2 m Wassersäule"],["1 mbar","100 Pa ≈ 10,2 mm Wassersäule"],
  ["1 kWh","3.600 kJ = 3,6 MJ"],["1 W","1 J/s"],["1 m³","1.000 l"],["1 l/s","3,6 m³/h"],["1 Zoll","25,4 mm"],["0 °C","273,15 K"],["1 K Differenz","1 °C Differenz"]];
const REF_FX = [["Wärmemenge","Q = m × c × Δθ","c(Wasser) ≈ 4,19 kJ/(kg·K) = 1,163 Wh/(kg·K)"],
  ["Wärmeleistung","Q̇ = ṁ × c × Δθ","ṁ in kg/h ergibt Q̇ in W"],["Längenänderung","Δl = α × l × Δθ","α in mm/(m·K), l in m ergibt Δl in mm"],
  ["Volumenstrom","V̇ = A × v","A = π ÷ 4 × d²"],["Hydrostatischer Druck","p = ρ × g × h","Wasser: etwa 0,1 bar je Meter Höhe"],
  ["Ohmsches Gesetz","U = R × I","P = U × I"],["MAG-Vordruck","p₀ = h ÷ 10 + 0,2 bar","h = statische Höhe in m"],
  ["Mischwasser","m_w = m_M × (θ_M − θ_K) ÷ (θ_W − θ_K)","Warmwasseranteil einer Mischung"]];
const refTbl = (head, rows) => `<div class="twrap"><table><thead><tr>${head.map(([h,c])=>`<th class="${c||""}">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(([v,c])=>`<td class="${c||""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const refIn = (id, label, unit, val) => `<label for="${id}">${label}<div class="cin"><input id="${id}" inputmode="decimal" autocomplete="off" value="${val}"><span>${unit}</span></div></label>`;
const refVal = id => numIn($(id).value);
function refLive(ids, fn){ ids.forEach(id=>{ const e=$(id); if(e) e.oninput=e.onchange=fn; }); fn(); }
const REF = [
  {id:"cu", name:"Kupferrohre", sub:"Maße und Wasserinhalt nach DIN EN 1057", html:()=>refTbl(
    [["Außen-Ø × Wand (mm)"],["Innen-Ø mm","num"],["Inhalt l/m","num"]],
    REF_CU.map(p=>[[`Cu ${fi(p.od)} × ${f(p.w,1)}`],[f(p.di,1),"num"],[f(refLpm(p.di),3),"num"]]))},
  {id:"st", name:"Gewinderohre", sub:"DN, Zoll und Maße nach DIN EN 10255, mittlere Reihe", html:()=>refTbl(
    [["DN"],["Zoll"],["Außen × Wand mm","num"],["Innen-Ø mm","num"],["Inhalt l/m","num"]],
    REF_ST.map(p=>[[p.dn],[p.inch+"″"],[`${f(p.od,1)} × ${f(p.w,1)}`,"num"],[f(p.di,1),"num"],[f(refLpm(p.di),3),"num"]]))
    +`<p class="sub">Früher DIN 2440. Die Zollangabe bezeichnet die Nennweite, nicht den tatsächlichen Durchmesser.</p>`},
  {id:"thr", name:"Rohrgewinde", sub:"Whitworth-Rohrgewinde nach ISO 228 und EN 10226", html:()=>refTbl(
    [["Größe"],["Außen-Ø mm","num"],["Gänge je Zoll","num"],["Steigung mm","num"]],
    REF_THR.map(([sz,od,tpi])=>[[`G/R ${sz}`],[f(od,3),"num"],[tpi,"num"],[f(25.4/tpi,3),"num"]]))
    +`<p class="sub">G = zylindrisches Rohrgewinde (ISO 228). R und Rp = kegeliges bzw. zylindrisches Gewinde für im Gewinde dichtende Verbindungen (EN 10226).</p>`},
  {id:"col", name:"Rohrkennzeichnung", sub:"Kennfarben nach Durchflussstoff, DIN 2403", html:()=>refTbl(
    [["Gr.","num"],["Durchflussstoff"],["Farbe"]],
    REF_COL.map(([g,m,c,hex,x])=>[[g,"num"],[m],[`<span class="swatch" style="background:${hex}${x?`;box-shadow:inset -11px 0 0 ${x}`:""}" aria-hidden="true"></span>${c}`]]))},
  {id:"dl", name:"Längenausdehnung", sub:"Ausdehnungskoeffizienten und Rechner", html:()=>refTbl(
    [["Werkstoff"],["α in mm/(m·K)","num"]], REF_ALPHA.map(([m,a])=>[[m],[fi(a),"num"]]))
    +`<section class="card"><h2>Rechner</h2><div class="fgrid" style="margin-top:12px">
      <label for="rMat">Werkstoff<select id="rMat">${REF_ALPHA.map(([m],i)=>`<option value="${i}">${m}</option>`).join("")}</select></label>
      ${refIn("rLen","Rohrlänge","m","10")}${refIn("rDt","Temperaturänderung","K","50")}</div>
      <p class="cres" id="rOut" aria-live="polite"></p>
      <div class="formel"><span class="eyebrow">Formel</span><p>Δl = α × l × Δθ</p></div></section>`,
    bind(){ refLive(["rMat","rLen","rDt"], ()=>{ const a=REF_ALPHA[+$("rMat").value][1], l=refVal("rLen"), d=refVal("rDt");
      $("rOut").textContent = isNaN(l)||isNaN(d)||l<0 ? "Bitte gültige Werte eingeben" : `Δl = ${f(a*l*d,1)} mm`; }); }},
  {id:"vol", name:"Wasserinhalt", sub:"Rechner für Rohrleitungen, auch für die 3-Liter-Regel", html:()=>`<section class="card"><div class="fgrid">
      <label for="rPipe">Rohr<select id="rPipe">${REF_CU.map((p,i)=>`<option value="c${i}">Cu ${fi(p.od)} × ${f(p.w,1)}</option>`).join("")}${REF_ST.map((p,i)=>`<option value="s${i}">Stahl DN ${p.dn} (${p.inch}″)</option>`).join("")}</select></label>
      ${refIn("rVl","Länge","m","10")}</div>
      <p class="cres" id="rVo" aria-live="polite"></p>
      <div class="formel"><span class="eyebrow">Formel</span><p>V = π ÷ 4 × d² × L</p></div></section>`,
    bind(){ refLive(["rPipe","rVl"], ()=>{ const v=$("rPipe").value, p=(v[0]==="c"?REF_CU:REF_ST)[+v.slice(1)], L=refVal("rVl"), o=$("rVo");
      if(isNaN(L)||L<0){ o.textContent="Bitte gültige Länge eingeben"; o.classList.remove("warn"); return; }
      const V=refLpm(p.di)*L; o.textContent=`${f(V)} Liter${V>3?" · mehr als 3 Liter":""}`; o.classList.toggle("warn", V>3); }); }},
  {id:"vs", name:"Heizungs-Volumenstrom", sub:"Rechner aus Wärmeleistung und Spreizung", html:()=>`<section class="card"><div class="fgrid">
      ${refIn("rKw","Wärmeleistung","kW","10")}${refIn("rSp","Spreizung","K","10")}</div>
      <p class="cres" id="rVs" aria-live="polite"></p>
      <div class="formel"><span class="eyebrow">Formel</span><p>V̇ = Q̇ ÷ (c × Δθ)   c = 1,163 Wh/(kg·K)</p></div></section>`,
    bind(){ refLive(["rKw","rSp"], ()=>{ const P=refVal("rKw"), d=refVal("rSp");
      $("rVs").textContent = isNaN(P)||isNaN(d)||P<0||d<=0 ? "Bitte Werte größer 0 eingeben" : `${f(P*1000/(1.163*d),0)} l/h · ${f(P/(1.163*d),2)} m³/h`; }); }},
  {id:"units", name:"Einheiten", sub:"Häufige Umrechnungen", html:()=>refTbl([["Wert"],["entspricht"]], REF_UNITS.map(([a,b])=>[[a],[b]]))},
  {id:"fx", name:"Formeln", sub:"Wichtige Formeln für Heizung und Sanitär", html:()=>REF_FX.map(([n,x,note])=>`<section class="card fcard"><span class="eyebrow">${n}</span><p class="fx">${x}</p><p class="sub">${note}</p></section>`).join("")}
];
let REF_ID = null;
function refView(){
  const s = REF_ID && REF.find(x=>x.id===REF_ID);
  if(s) return `<button class="back" id="refBack">‹ Alle Tabellen</button><h1 class="ptitle">${s.name}</h1><p class="sub">${s.sub}</p>${s.html()}<p class="share">Angaben ohne Gewähr. Maßgeblich sind die gültigen Normen, Regelwerke und Herstellerangaben.</p>`;
  return `<h1 class="ptitle">Tabellen</h1><p class="sub">Nachschlagen für Werkstatt, Baustelle und Prüfung.</p>
  <div class="glist">${REF.map(x=>`<button class="gcard" data-ref="${x.id}"><span class="gname">${x.name}</span><span class="sub">${x.sub}</span></button>`).join("")}</div>`;
}
function refBind(){
  document.querySelectorAll("[data-ref]").forEach(b=>b.onclick=()=>{ REF_ID=b.dataset.ref; render(); scrollTo({top:0}); });
  const bk=$("refBack"); if(bk) bk.onclick=()=>{ REF_ID=null; render(); scrollTo({top:0}); };
  const s = V==="ref" && REF_ID && REF.find(x=>x.id===REF_ID); if(s && s.bind) s.bind();
}

function render(){
  const inQuiz = V==="quiz";
  document.body.classList.toggle("inquiz", inQuiz);
  $("tabs").hidden = inQuiz;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.v===V||(V==="result"&&b.dataset.v===(P.sess&&P.sess.kind==="calc"?"calc":"home"))?"page":"false"));
  const m=$("main");
  const ck = P.sess && P.sess.kind==="calc";
  m.innerHTML = V==="home"?home():V==="topics"?topicsView():V==="calc"?calcMenu():V==="exam"?examView():V==="ref"?refView():V==="stats"?statsView():V==="quiz"?(ck?calcQuizView():quizView()):(ck?calcResultView():resultView());
  bind();
}
function bind(){
  calcBind();
  refBind();
  const on=(id,fn)=>{ const e=$(id); if(e) e.onclick=fn; };
  on("smart", smartRound); on("wrongB", wrongRound); on("markB", markedRound);
  on("resume", ()=>{ V="quiz"; render(); });
  on("goCalc", ()=>{ V="calc"; render(); scrollTo({top:0}); });
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ V="topics"; render(); const e=$("g-"+b.dataset.g); if(e) e.scrollIntoView(); });
  document.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>learnTopics(b.dataset.learn.split(","), b.dataset.title));
  document.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>startExam(PRESETS.find(p=>p.id===b.dataset.exam)));
  on("reset", ()=>{ $("resetAsk").innerHTML=`<div class="notice"><p>Wirklich alles löschen?</p><button class="btn primary" id="resetOk">Löschen</button></div>`; on("resetOk", ()=>{ P={q:{},mark:{},day:{},hist:[],sess:null,calc:{}}; save(); render(); }); });
  on("toHome", ()=>{ V="home"; render(); });
  on("more", ()=>{ const S=P.sess; S && S.kind==="learn" && S.title!=="Fehlertraining" && S.title!=="Markierte Fragen" ? (S.title==="Weiterlernen"?smartRound():learnTopics(topicsForTitle(S.title), S.title)) : smartRound(); });
  on("again", ()=>{ const S=P.sess; startSession("learn","Fehlertraining", shuffle(S.ids.filter(id=>S.ans[id]!==BY[id].a))); });
  if(V!=="quiz" || P.sess.kind==="calc") return;
  const S=P.sess, id=S.ids[S.i];
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(S.kind==="learn"){ if(S.ans[id]!==undefined) return; S.ans[id]=k; record(id, k===BY[id].a); }
    else S.ans[id]=k;
    save(); render();
  });
  on("star", ()=>{ P.mark[id]=!P.mark[id]; save(); render(); });
  on("next", ()=>{ if(S.i<S.ids.length-1){ S.i++; save(); render(); scrollTo({top:0}); } else if(S.kind==="learn"){ S.done=true; P.sess=S; save(); V="result"; render(); scrollTo({top:0}); } });
  on("prev", ()=>{ S.i--; save(); render(); scrollTo({top:0}); });
  on("gridT", ()=>{ S.grid=!S.grid; save(); render(); });
  document.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{ S.i=+b.dataset.j; save(); render(); });
  on("submit", ()=>{ S.grid=true; render(); const open=S.ids.length-Object.keys(S.ans).length; $("subAsk").innerHTML=`<div class="notice"><p>${open?`${open} Fragen sind noch offen und zählen 0 Punkte. `:""}Jetzt abgeben?</p><button class="btn primary" id="subOk">Abgeben</button></div>`; on("subOk", finishExam); $("subAsk").scrollIntoView({block:"nearest"}); });
  on("quit", ()=>{
    $("quitAsk").innerHTML=`<div class="notice"><p>${S.kind==="exam"?"Prüfung pausieren? Die Uhr läuft weiter.":"Runde beenden? Deine Antworten sind schon gespeichert."}</p><button class="btn primary" id="qOk">${S.kind==="exam"?"Zur Startseite":"Beenden"}</button><button class="btn" id="qNo">Weiter üben</button></div>`;
    on("qOk", ()=>{ if(S.kind==="learn"){ S.done=true; } save(); V="home"; render(); });
    on("qNo", ()=>{ $("quitAsk").innerHTML=""; });
  });
}
function topicsForTitle(t){ const g=GROUPS.find(g=>g.name===t); if(g) return g.topics; const k=Object.keys(NAMES).find(k=>NAMES[k]===t); return k?[k]:BANK.map(q=>q.tp); }
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ V=b.dataset.v; if(V==="ref") REF_ID=null; render(); scrollTo({top:0}); });
setInterval(()=>{
  const S=P.sess; if(!S || S.kind!=="exam" || S.done) return;
  const left=S.start+S.dur-Date.now();
  if(left<=0){ finishExam(); return; }
  const t=$("timer"); if(t){ t.textContent=fmtTime(left); t.classList.toggle("low", left<5*60000); }
},1000);
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
